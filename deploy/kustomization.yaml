# Argo CD deploys this folder to team-hack. The deploy workflow sets the image
# tag on every push to main; don't edit newName or newTag by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-hack
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - demo-feeder.yaml
images:
  - name: app
    newName: ghcr.io/moezdil/hack
    newTag: "f8b8b22"
