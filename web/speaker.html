<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c1a17">
<title>Speaker: Readalong</title>
<style>
  :root { --ink: #1c1a17; --paper: #fff7e6; --coral: #e8472b; --mustard: #f5b301; --mint: #7fe3c0; --sky: #6ea8ff; --mute: #b8b0a3; --panel: #27241f; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--paper); background: var(--ink); font: 18px/1.5 "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  .logo { font: 700 1.3rem/1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .logo span { color: var(--coral); }
  h1 { font: 800 clamp(1.8rem, 5vw, 2.8rem)/1.05 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: -.02em; margin: 1rem 0 1.2rem; }
  h1 mark { background: linear-gradient(transparent 60%, var(--mustard) 60%); color: inherit; }
  .card { background: var(--panel); border: 2px solid #3a362f; border-radius: 1.2rem; padding: 1.3rem; margin-bottom: 1rem; }
  label { display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; color: var(--mute); margin-bottom: .4rem; }
  input { width: 100%; font: inherit; font-size: 1.15rem; padding: .8rem 1rem; border-radius: .8rem; border: 2px solid #3a362f; background: #15130f; color: var(--paper); }
  input:focus, button:focus-visible, a:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  .row { display: flex; gap: .8rem; flex-wrap: wrap; margin-top: 1rem; }
  button { font: 700 1.05rem "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; padding: .9rem 1.2rem; border-radius: .8rem; border: 2px solid var(--paper); background: transparent; color: var(--paper); cursor: pointer; flex: 1 1 8rem; }
  button:disabled { opacity: .4; cursor: default; }
  #start { background: var(--coral); border-color: var(--coral); color: #fff; }
  #status { display: flex; align-items: center; gap: .6rem; margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1rem; }
  .dot { width: .8rem; height: .8rem; border-radius: 50%; background: var(--mute); flex: none; }
  .live .dot { background: var(--mint); box-shadow: 0 0 0 .35rem rgba(127,227,192,.25); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .8rem rgba(127,227,192,0); } }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .8rem; margin-top: 1rem; }
  .stat { background: #15130f; border: 2px solid #3a362f; border-radius: .9rem; padding: .8rem 1rem; }
  .stat b { display: block; font: 800 2.2rem/1.1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; color: var(--mustard); }
  .stat span { color: var(--mute); font-size: .85rem; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #last { min-height: 3.2rem; font-size: 1.3rem; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .hint { color: var(--mute); font-size: .9rem; margin: .8rem 0 0; }
  .hint a { color: var(--mint); }
  .share { display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; }
  .share code { background: #15130f; border: 2px solid #3a362f; border-radius: .6rem; padding: .4rem .6rem; font-size: .9rem; word-break: break-all; }
  .share button { flex: 0 0 auto; padding: .5rem .9rem; font-size: .9rem; }
  .tip { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; color: var(--mint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">read<span>along</span></div>
  <h1>You're on in <mark id="room"></mark></h1>

  <section class="card">
    <label for="token">speaker token</label>
    <input id="token" type="password" autocomplete="off">
    <div class="row">
      <button id="start">Start captions</button>
      <button id="pause" disabled>Pause</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <label class="opt" style="display:flex;gap:.6rem;align-items:center;margin-top:1rem;font-family:inherit;font-size:1rem;color:var(--paper)">
      <input id="save" type="checkbox" style="width:1.3rem;height:1.3rem;margin:0"> Save transcript so listeners can search it (off by default)
    </label>
    <p class="hint">Pause for Q&amp;A or private moments. Chrome only: recognition runs in the browser and audio goes to Google's speech service.</p>
  </section>

  <section class="card">
    <p id="status" role="status"><span class="dot" aria-hidden="true"></span><span id="statusText">stopped</span></p>
    <div class="stats">
      <div class="stat"><b id="listeners">0</b><span>reading along</span></div>
      <div class="stat"><b id="restarts">0</b><span>recognition restarts</span></div>
    </div>
  </section>

  <section class="card">
    <label>last caption</label>
    <div id="last" aria-live="off"></div>
  </section>

  <section class="card share">
    <code id="link"></code>
    <button id="copy" type="button">Copy link</button>
    <p class="tip" style="flex-basis:100%;margin:.2rem 0 0">Tell the room: "scan the QR, read along on your phone". Late joiners get the last 50 lines.</p>
  </section>
</div>
<script>
const room = location.pathname.split("/")[2];
document.getElementById("room").textContent = room;
const url = location.origin + "/r/" + room;
document.getElementById("link").textContent = url;
document.getElementById("copy").onclick = async () => {
  const b = document.getElementById("copy");
  try { await navigator.clipboard.writeText(url); b.textContent = "Copied"; } catch (e) { b.textContent = "Select and copy"; }
  setTimeout(() => b.textContent = "Copy link", 1500);
};
const tokenEl = document.getElementById("token");
tokenEl.value = sessionStorage.getItem("token") || "";
const statusText = document.getElementById("statusText");
const statusEl = document.getElementById("status");
const lastEl = document.getElementById("last");
const btn = id => document.getElementById(id);

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) statusText.textContent = "this browser has no speech recognition. Use Chrome.";

let rec, running = false, seq = 0, listeners = 0, restarts = 0;

function setState(text) {
  statusText.textContent = text;
  statusEl.classList.toggle("live", text === "live");
  btn("listeners").textContent = listeners;
  btn("restarts").textContent = restarts;
}

async function send(text, final) {
  try {
    const res = await fetch(`/api/rooms/${room}/captions`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tokenEl.value },
      body: JSON.stringify({ seq: ++seq, text, final, spokenAt: Date.now(), save: document.getElementById("save").checked }),
    });
    if (res.status === 401) { setState("wrong token"); return; }
    if (res.ok) { listeners = (await res.json()).listeners; btn("listeners").textContent = listeners; }
  } catch (e) {
    setState("network error");
  }
}

function start() {
  if (!SR) return;
  sessionStorage.setItem("token", tokenEl.value);
  rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = "en-US";
  rec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      const text = r[0].transcript.trim().slice(0, 500);
      if (!text) continue;
      send(text, r.isFinal);
      if (r.isFinal) lastEl.textContent = text;
    }
    setState("live");
  };
  rec.onerror = e => setState("recognition error: " + e.error);
  // Chrome stops on its own after silence or about a minute; restart unless the speaker paused or stopped.
  rec.onend = () => { if (running) { restarts++; try { rec.start(); } catch (e) {} } };
  running = true;
  rec.start();
  btn("start").disabled = true; btn("pause").disabled = false; btn("stop").disabled = false;
  setState("live");
}

function halt(label) {
  running = false;
  if (rec) rec.stop();
  btn("start").disabled = false; btn("pause").disabled = true; btn("stop").disabled = label === "stopped";
  btn("start").textContent = label === "paused" ? "Resume" : "Start captions";
  setState(label);
}

btn("start").onclick = start;
btn("pause").onclick = () => halt("paused");
btn("stop").onclick = () => halt("stopped");
</script>
</body>
</html>
