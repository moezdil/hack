<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Speaker: live captions</title>
<style>
  :root { --bg: #0b1020; --panel: #121a33; --fg: #f3f6ff; --muted: #aab4d6; --accent: #38e8c6; --accent-ink: #052a24; --line: #26315a; --warn: #ffd166; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background:
         radial-gradient(900px 500px at 90% -10%, #1b2b6b 0%, transparent 60%), var(--bg); min-height: 100vh; }
  main { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
  .brand { font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: .4rem 0 1.2rem; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: 1.25rem; margin-bottom: 1rem; }
  label { display: block; font-size: .95rem; color: var(--muted); margin-bottom: .4rem; }
  input { width: 100%; font: inherit; font-size: 1.15rem; padding: .75rem 1rem; border-radius: .7rem; border: 1px solid var(--line); background: #0d1430; color: var(--fg); }
  input:focus, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1rem; }
  button { font: inherit; font-weight: 700; padding: .85rem 1.3rem; border-radius: .7rem; border: 2px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; flex: 1 1 8rem; }
  button:disabled { opacity: .45; cursor: default; }
  #start { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  #status { display: flex; align-items: center; gap: .6rem; font-weight: 600; margin: 0; }
  .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--muted); flex: none; }
  .live .dot { background: var(--accent); box-shadow: 0 0 0 .35rem rgba(56,232,198,.2); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .7rem rgba(56,232,198,0); } }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .75rem; margin-top: 1rem; }
  .stat { background: #0d1430; border: 1px solid var(--line); border-radius: .8rem; padding: .8rem 1rem; }
  .stat b { display: block; font-size: 1.8rem; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: .9rem; }
  #last { min-height: 3.2rem; font-size: 1.25rem; color: var(--fg); }
  .hint { color: var(--muted); font-size: .9rem; margin: 0; }
  .hint a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="brand">readalong</div>
  <h1>Speaking in <em id="room"></em></h1>

  <section class="card">
    <label for="token">Speaker token</label>
    <input id="token" type="password" autocomplete="off">
    <div class="row">
      <button id="start">Start captions</button>
      <button id="pause" disabled>Pause</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <p class="hint" style="margin-top:.8rem">Pause for Q&amp;A or private moments. Chrome only: recognition runs in the browser and audio goes to Google's speech service.</p>
  </section>

  <section class="card">
    <p id="status" role="status"><span class="dot" aria-hidden="true"></span><span id="statusText">Stopped</span></p>
    <div class="stats">
      <div class="stat"><b id="listeners">0</b><span>listening now</span></div>
      <div class="stat"><b id="restarts">0</b><span>recognition restarts</span></div>
    </div>
  </section>

  <section class="card">
    <label>Last caption</label>
    <div id="last" aria-live="off"></div>
  </section>

  <p class="hint">Listeners open <a id="link"></a> or scan the QR on your slide.</p>
</main>
<script>
const room = location.pathname.split("/")[2];
document.getElementById("room").textContent = room;
const link = document.getElementById("link");
link.textContent = location.origin + "/r/" + room; link.href = "/r/" + room;
const tokenEl = document.getElementById("token");
tokenEl.value = sessionStorage.getItem("token") || "";
const statusText = document.getElementById("statusText");
const statusEl = document.getElementById("status");
const lastEl = document.getElementById("last");
const btn = id => document.getElementById(id);

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) statusText.textContent = "This browser has no speech recognition. Use Chrome.";

let rec, running = false, seq = 0, listeners = 0, restarts = 0;

function setState(text) {
  statusText.textContent = text;
  statusEl.classList.toggle("live", text === "Live");
  btn("listeners").textContent = listeners;
  btn("restarts").textContent = restarts;
}

async function send(text, final) {
  try {
    const res = await fetch(`/api/rooms/${room}/captions`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tokenEl.value },
      body: JSON.stringify({ seq: ++seq, text, final, spokenAt: Date.now() }),
    });
    if (res.status === 401) { setState("Wrong token"); return; }
    if (res.ok) { listeners = (await res.json()).listeners; btn("listeners").textContent = listeners; }
  } catch (e) {
    setState("Network error");
  }
}

function start() {
  if (!SR) return;
  sessionStorage.setItem("token", tokenEl.value);
  rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = "en-US";
  rec.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      const text = r[0].transcript.trim().slice(0, 500);
      if (!text) continue;
      send(text, r.isFinal);
      if (r.isFinal) lastEl.textContent = text;
    }
    setState("Live");
  };
  rec.onerror = e => setState("Recognition error: " + e.error);
  // Chrome stops on its own after silence or about a minute; restart unless the speaker paused or stopped.
  rec.onend = () => { if (running) { restarts++; try { rec.start(); } catch (e) {} } };
  running = true;
  rec.start();
  btn("start").disabled = true; btn("pause").disabled = false; btn("stop").disabled = false;
  setState("Live");
}

function halt(label) {
  running = false;
  if (rec) rec.stop();
  btn("start").disabled = false; btn("pause").disabled = true; btn("stop").disabled = label === "Stopped";
  btn("start").textContent = label === "Paused" ? "Resume" : "Start captions";
  setState(label);
}

btn("start").onclick = start;
btn("pause").onclick = () => halt("Paused");
btn("stop").onclick = () => halt("Stopped");
</script>
</body>
</html>
