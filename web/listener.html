<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23e8472b%27/%3E%3Ctext x=%2732%27 y=%2744%27 text-anchor=%27middle%27 font-family=%27Georgia,serif%27 font-weight=%27700%27 font-size=%2736%27 fill=%27%23fff7e6%27%3Er%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#fff7e6">
<title>Readalong</title>
<style>
  :root { --fg: #1c1a17; --bg: #fff7e6; --muted: #5e574d; --line: #1c1a17; --accent: #e8472b; --soft: #ffe3b3; --size: 24px; }
  body.contrast { --fg: #ffffff; --bg: #000000; --muted: #e6e6e6; --line: #ffffff; --accent: #ffd166; --soft: #1f1f1f; }
  * { box-sizing: border-box; min-width: 0; }
  html, body { overflow-x: hidden; }
  body { font: var(--size)/1.5 "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; margin: 0; color: var(--fg); background: var(--bg); }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 2px solid var(--line);
           padding: .6rem .9rem; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; font-size: 16px; }
  .logo { font: 700 1.15rem/1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; margin-right: .3rem; }
  .logo span { color: var(--accent); }
  header button { font: 600 16px "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; min-height: 2.7rem; padding: .35rem .85rem; border-radius: .7rem;
                  color: var(--fg); background: var(--bg); border: 2px solid var(--line); cursor: pointer; }
  header button[aria-pressed="true"] { background: var(--soft); }
  header button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #badge { flex: 1 1 100%; text-align: center; font: 700 14px ui-monospace, Menlo, Consolas, monospace; padding: .35rem .7rem; border-radius: 999px; border: 2px solid var(--line); background: var(--soft); color: var(--fg); }
  @media (min-width: 640px) { #badge { flex: 0 0 auto; margin-left: auto; } }
  #finals p, #interim, .empty { overflow-wrap: anywhere; }
  main { padding: 1.2rem 1rem 6rem; max-width: 50rem; margin: 0 auto; }
  #finals p { margin: 0 0 .9rem; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  #interim { color: var(--muted); font-style: italic; min-height: 1.5em; }
  .empty { color: var(--muted); font-size: .85em; font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .nudge { position: fixed; left: 0; right: 0; bottom: 0; padding: .6rem 1rem; font: 14px ui-monospace, Menlo, Consolas, monospace; color: var(--fg); background: var(--bg); border-top: 2px solid var(--line); display: flex; gap: .8rem; align-items: center; justify-content: space-between; }
  .nudge span { flex: 1 1 auto; overflow-wrap: anywhere; }
  .nudge button { flex: 0 0 auto; }
  .nudge button { font: 600 14px "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif; min-height: 2.4rem; padding: .3rem .8rem; border-radius: .6rem; color: var(--bg); background: var(--fg); border: 2px solid var(--fg); cursor: pointer; }
</style>
</head>
<body>
<header>
  <span class="logo">read<span>along</span></span>
  <button id="smaller" aria-label="Smaller text">A−</button>
  <button id="bigger" aria-label="Bigger text">A+</button>
  <button id="contrast" aria-pressed="false">High contrast</button>
  <button id="scroll" aria-pressed="false">Pause scroll</button>
  <select id="lang" hidden aria-label="Translate captions to" style="font:600 16px 'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif;min-height:2.7rem;padding:.3rem .6rem;border-radius:.7rem;border:2px solid var(--line);background:var(--bg);color:var(--fg)">
    <option value="">Original (as spoken)</option>
    <option value="en">English</option>
    <option value="tr">Türkçe</option><option value="de">Deutsch</option><option value="es">Español</option>
    <option value="fr">Français</option><option value="pt">Português</option><option value="it">Italiano</option>
    <option value="ja">日本語</option><option value="ko">한국어</option><option value="zh">中文</option>
    <option value="hi">हिन्दी</option><option value="ar">العربية</option>
  </select>
  <span id="badge" role="status">connecting</span>
</header>
<main>
  <form id="search" hidden style="display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem">
    <input id="q" type="search" placeholder="Search what was said" aria-label="Search the transcript" style="flex:1 1 12rem;min-width:0;font:inherit;font-size:16px;padding:.5rem .8rem;border:2px solid var(--line);border-radius:.7rem;background:var(--bg);color:var(--fg)">
    <button type="submit" style="font:600 16px 'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif;padding:.4rem .9rem;border-radius:.7rem;border:2px solid var(--line);background:var(--soft);color:var(--fg)">Find</button>
  </form>
  <div id="hits" aria-live="polite" style="font-size:.85em;margin-bottom:1rem"></div>
  <div id="finals" aria-live="polite"><p class="empty" id="empty">Captions appear here as the speaker talks. Say hi to the person next to you while you wait.</p></div>
  <p id="interim" aria-hidden="true"></p>
</main>
<div class="nudge">
  <span id="nudgeText">Reading along next to someone? Share the link.</span>
  <button id="share" type="button">Share</button>
</div>
<script>
const room = location.pathname.split("/")[2];
document.title = `Readalong: ${room}`;
const finalsEl = document.getElementById("finals");
const interimEl = document.getElementById("interim");
const badge = document.getElementById("badge");
const root = document.documentElement;
let size = Number(localStorage.getItem("size")) || 24;
let pauseScroll = false, lastSpokenAt = 0, connected = false;

function applySize() { root.style.setProperty("--size", size + "px"); localStorage.setItem("size", size); }
applySize();
document.getElementById("smaller").onclick = () => { size = Math.max(14, size - 4); applySize(); };
document.getElementById("bigger").onclick = () => { size = Math.min(64, size + 4); applySize(); };

const contrastBtn = document.getElementById("contrast");
function applyContrast(on) {
  document.body.classList.toggle("contrast", on);
  contrastBtn.setAttribute("aria-pressed", on);
  document.querySelector('meta[name="theme-color"]').content = on ? "#000000" : "#fff7e6";
  localStorage.setItem("contrast", on ? "1" : "");
}
applyContrast(localStorage.getItem("contrast") === "1");
contrastBtn.onclick = () => applyContrast(!document.body.classList.contains("contrast"));

const scrollBtn = document.getElementById("scroll");
scrollBtn.onclick = () => {
  pauseScroll = !pauseScroll;
  scrollBtn.setAttribute("aria-pressed", pauseScroll);
  scrollBtn.textContent = pauseScroll ? "Resume scroll" : "Pause scroll";
};

document.getElementById("share").onclick = async () => {
  const data = { title: "Readalong", text: "Live captions for this talk", url: location.href };
  const t = document.getElementById("nudgeText");
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(location.href); t.textContent = "Link copied.";
  } catch (e) { t.textContent = location.href; }
};

function addFinal(text) {
  const empty = document.getElementById("empty");
  if (empty) empty.remove();
  const p = document.createElement("p");
  p.textContent = text;
  finalsEl.appendChild(p);
}
function follow() { if (!pauseScroll) window.scrollTo(0, document.body.scrollHeight); }

const searchForm = document.getElementById("search");
fetch(`/api/rooms/${room}/search`).then(r => r.json()).then(j => { if (j.enabled) searchForm.hidden = false; }).catch(() => {});
searchForm.onsubmit = async e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  const hitsEl = document.getElementById("hits");
  if (!q) { hitsEl.replaceChildren(); return; }
  try {
    const r = await fetch(`/api/rooms/${room}/search?q=` + encodeURIComponent(q));
    const j = await r.json();
    hitsEl.replaceChildren();
    if (!j.hits || !j.hits.length) { hitsEl.textContent = "Nothing saved matches that yet."; return; }
    for (const h of j.hits) { const p = document.createElement("p"); p.textContent = "› " + h.text; hitsEl.appendChild(p); }
  } catch (err) { hitsEl.textContent = "Search is unavailable right now."; }
};

const langSel = document.getElementById("lang");
const stored = localStorage.getItem("lang");
const phone = (navigator.language || "").slice(0, 2).toLowerCase();
const lang = stored !== null ? stored : ([...langSel.options].some(o => o.value === phone) ? phone : "");
langSel.value = lang;
langSel.onchange = () => { localStorage.setItem("lang", langSel.value); location.reload(); };
fetch(`/api/rooms/${room}/search`).then(r => r.json()).then(j => { if (j.translate) langSel.hidden = false; }).catch(() => {});
const es = new EventSource(`/api/rooms/${room}/stream` + (lang ? `?lang=${encodeURIComponent(lang)}` : ""));
es.addEventListener("backlog", e => {
  connected = true;
  const items = JSON.parse(e.data) || [];
  // With a language chosen, only translated lines are shown: no original backlog, no original live line.
  if (!lang) { if (items.length) finalsEl.replaceChildren(); for (const c of items) addFinal(c.text); }
  follow();
});
es.addEventListener("caption", e => {
  const c = JSON.parse(e.data);
  lastSpokenAt = c.spokenAt;
  // With a language chosen, finished lines arrive translated; the live line stays in the original.
  if (c.lang) { addFinal(c.text); }
  else if (lang) { /* original text is not shown when a language is chosen */ }
  else if (c.final) { addFinal(c.text); interimEl.textContent = ""; }
  else { interimEl.textContent = c.text; }
  follow();
});
// On "bye" the server is restarting; EventSource reconnects on its own and the backlog fills the gap.
es.addEventListener("bye", () => { connected = false; });
es.onerror = () => { connected = false; };

setInterval(() => {
  if (!connected) { badge.textContent = "reconnecting"; return; }
  if (!lastSpokenAt) { badge.textContent = "waiting for the speaker"; return; }
  // ponytail: uses device clocks; a server clock offset is the upgrade if phones drift.
  const behind = Math.max(0, Math.round((Date.now() - lastSpokenAt) / 1000));
  badge.textContent = `last caption ${behind}s ago`;
}, 1000);
</script>
</body>
</html>
